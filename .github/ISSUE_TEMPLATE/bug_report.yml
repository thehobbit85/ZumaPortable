name: Bug Report
description: Report a bug or unexpected behavior in Zuma Deluxe Portable
labels: ["bug"]
body:
  - type: dropdown
    id: source
    attributes:
      label: Installation Source
      description: How did you get the app?
      options:
        - Prebuilt APK from Releases
        - Self-compiled from source
        - Desktop binary from Releases
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit hash (`git describe --tags` when built from source).
      placeholder: "v0.1.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where are you running it?
      options:
        - Android (arm64 device)
        - Android (emulator / other ABI)
        - Windows x64
        - Windows x86
        - Linux x64
        - WebAssembly in a browser
        - Other
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and OS version
      description: Phone model and Android version, or OS and GPU driver on desktop.
      placeholder: "Pixel 7, Android 14 / Windows 11, RTX 3060"
    validations:
      required: true

  - type: dropdown
    id: resources
    attributes:
      label: Game data source
      description: Where did the Zuma Deluxe files come from?
      options:
        - Steam release
        - EA / Origin release
        - Original 2003 CD release
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happens
      description: What you expected, what actually happened, and whether it is reproducible.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch the app
        2. Import the ZIP from ...
        3. Start a game
        4. See ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: >
        Android: attach `zuma-diag.txt` from your Downloads folder (the app mirrors its native
        log there). Desktop: paste the terminal output. Screenshots help.
    validations:
      required: false
